<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Backend security flow</title>
<desc id="d">A request moves through JWT verification, role check, resource access, validation, business logic and database. Failures return 403 Forbidden; authorized requests return a response.</desc>
