<path d="M720 556H752V536H800" fill="none" stroke="#B6FF3B" stroke-width="1.5" marker-end="url(#a-lime)"/>
<path d="M720 556H752V636H800" fill="none" stroke="#FF6B6B" stroke-width="1.5" marker-end="url(#a-red)"/>
<rect x="800" y="506" width="340" height="60" fill="#141816" stroke="#B6FF3B" stroke-width="1.5"/>
<text x="820" y="536" font-size="17" font-weight="700" fill="#B6FF3B" text-anchor="start" letter-spacing="1">AUTHORIZED</text>
<text x="820" y="558" font-size="13" font-weight="400" fill="#98A19B" text-anchor="start" letter-spacing="0">Evaluation returned</text>
<rect x="800" y="606" width="340" height="60" fill="#141816" stroke="#FF6B6B" stroke-width="1.5"/>
