<text x="60" y="500" font-size="13" font-weight="600" fill="#98A19B" text-anchor="start" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REQUEST PATH</text>
<rect x="60" y="520" width="300" height="72" fill="#141816" stroke="#2B322E" stroke-width="1.5"/>
<text x="80" y="550" font-size="17" font-weight="700" fill="#F2F4F1" text-anchor="start" letter-spacing="1">ACCESS CONTROL</text>
