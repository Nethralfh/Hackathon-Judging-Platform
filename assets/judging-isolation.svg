<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Backend-enforced judge isolation</title>
<desc id="d">Judge A with projects 01, 04, 07 and Judge B with projects 02, 05, 08 are separated by a blocked path returning 403 Forbidden. Access control and resource validation decide authorized or denied.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#181D1A" stroke-width="1"/></pattern>
<marker id="a-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#B6FF3B"/></marker>
<marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#98A19B"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#FF6B6B"/></marker>
<marker id="a-cy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#4DD9E8"/></marker>
</defs>
<rect width="1200" height="700" fill="#0D0F0E"/>
<rect width="1200" height="700" fill="url(#grid)"/>
<text x="60" y="62" font-size="28" font-weight="700" fill="#F2F4F1" text-anchor="start" letter-spacing="0">Judge A cannot read Judge B's evaluations.</text>
<text x="60" y="92" font-size="13" font-weight="600" fill="#98A19B" text-anchor="start" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ENFORCED BY THE BACKEND, NOT THE INTERFACE</text>
<rect x="60" y="130" width="480" height="320" fill="#141816" stroke="#B6FF3B" stroke-width="1.2"/>
<g transform="translate(102 176)" fill="none" stroke="#B6FF3B" stroke-width="2"><circle cx="0" cy="-5" r="8"/><path d="M-14 14C-14 3 14 3 14 14"/></g>
<text x="132" y="176" font-size="21" font-weight="800" fill="#F2F4F1" text-anchor="start" letter-spacing="1.5">JUDGE A</text>
