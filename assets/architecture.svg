<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">System architecture</title>
<desc id="d">Frontend calls a REST API served by FastAPI with authentication, authorization, events, teams, projects, judging, scoring and results modules, persisted through SQLAlchemy to PostgreSQL. JWT, Pydantic, Alembic, Pytest and Docker support the stack.</desc>
